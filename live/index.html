<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live captions · AssemblyAI</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --panel: #18181b; --page: #09090b; --accent: #2563eb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  button, select, input, .button { font: inherit; color: inherit; }
  button, .button { background: #27272a; border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  button:hover, .button:hover { border-color: var(--muted); }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  select, input[type=text] { background: #27272a; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  [hidden] { display: none !important; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar form { margin: 0; }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .spacer { flex: 1; }

  /* The stage: where captions live. Its background is a setting: dark, transparent (overlays) or green (chroma key). */
  #stage { position: relative; flex: 1; min-height: 45vh; overflow: hidden; }
  body.bg-dark #stage { background: #000; }
  body.bg-green #stage, body.bg-green.overlay { background: #00b140; }
  body.bg-transparent #stage, body.bg-transparent.overlay { background: transparent; }

  .captions { --size: 44px; --lines: 2; --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
              position: absolute; left: 50%; transform: translateX(-50%); width: min(1200px, 92%);
              display: flex; flex-direction: column; align-items: center; gap: .3em; font-family: var(--font); }
  .captions.bottom { bottom: 6%; }
  .captions.top { top: 6%; }
  .captions.middle { top: 50%; transform: translate(-50%, -50%); }
  .text { font-size: var(--size); line-height: 1.25; width: 100%; padding: .15em .5em; border-radius: .2em; text-align: center; color: #fff; }
  /* Only the last lines show: the paragraph sits on the bottom of a box exactly --lines tall. */
  .lines { position: relative; height: calc(var(--lines) * 1.25em); overflow: hidden; }
  .lines p { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; overflow-wrap: anywhere; }
  .style-box .text { background: rgba(0, 0, 0, .75); }
  .style-box .text.empty { background: transparent; }
  .style-outline .text { text-shadow: 0 0 3px #000, 0 0 3px #000, 0 2px 6px #000, 0 0 1px #000; }
  .partial { opacity: .55; }
  .notice { font: 600 max(12px, calc(var(--size) * .3))/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #fff; background: rgba(0, 0, 0, .6); padding: .25em .7em; border-radius: 999px; letter-spacing: .01em; }
  .notice .dot { display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: #71717a; margin-right: .45em; vertical-align: .05em; }
  .notice.on .dot { background: #ef4444; }
  .hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(24, 24, 27, .92); border: 1px solid var(--line);
          border-radius: 8px; padding: 6px 12px; font-size: 14px; max-width: 92%; text-align: center; }
  .hint a { color: #93c5fd; }

  .panel { border-top: 1px solid var(--line); background: var(--panel); padding: 14px 16px 18px; display: grid; gap: 12px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; }
  .grid label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .consent { margin: 0; font-size: 13px; color: var(--muted); }
  #status { color: var(--muted); font-size: 14px; }
  #status.error { color: #fca5a5; }

  /* ?overlay=1: just the captions, for OBS, a shared window or a stage screen. */
  body.overlay .bar, body.overlay .panel { display: none; }
  body.overlay #stage { min-height: 100%; }
  body.pip { background: #000; }
  body.pip .captions { width: 96%; }
</style>
</head>
<body class="bg-dark">
<header class="bar">
  <strong>Live captions</strong>
  <span id="mode" class="badge">…</span>
  <span class="spacer"></span>
  <a id="signin" class="button primary" href="/login" hidden>Sign in with AssemblyAI</a>
  <form id="signout" method="post" action="/logout" hidden><button type="submit">Sign out</button></form>
</header>

<main id="stage">
  <div id="captions" class="captions bottom style-box">
    <div class="text empty"><div class="lines"><p id="text"></p></div></div>
    <div id="notice" class="notice"><span class="dot"></span><span id="noticetext">Live captions off</span> · powered by AssemblyAI</div>
  </div>
  <div id="hint" class="hint" hidden></div>
</main>

<section class="panel">
  <div class="row">
    <button id="start" class="primary" type="button">Start captions</button>
    <span id="status"></span>
  </div>
  <p class="consent">While captions are on, your microphone audio is sent to AssemblyAI live to be transcribed. Tell the people you're with that captions are on, and ask for consent where that's required. This page saves nothing.</p>
  <div class="grid">
    <label>Language
      <select id="lang">
        <option value="">Any: follows code-switching</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="nl">Dutch</option>
        <option value="hi">Hindi</option>
        <option value="ja">Japanese</option>
        <option value="zh">Mandarin</option>
        <option value="ar">Arabic</option>
        <option value="tr">Turkish</option>
        <option value="vi">Vietnamese</option>
        <option value="hi,en">Hindi + English (Hinglish)</option>
        <option value="es,en">Spanish + English</option>
        <option value="fr,en">French + English</option>
        <option value="de,en">German + English</option>
        <option value="ja,en">Japanese + English</option>
        <option value="zh,en">Mandarin + English</option>
        <option value="ar,en">Arabic + English</option>
        <option value="pt,en">Portuguese + English</option>
        <option value="ko">Korean (3.6 Pro)</option>
        <option value="ko,en">Korean + English (3.6 Pro)</option>
        <option value="ru">Russian (3.6 Pro)</option>
        <option value="custom">Other codes…</option>
      </select>
    </label>
    <label id="codesbox" hidden>Language codes <input id="codes" type="text" placeholder="e.g. en, sv" spellcheck="false"></label>
    <label>Model
      <select id="model">
        <option value="universal-3-5-pro">Universal-3.5 Pro Realtime</option>
        <option value="universal-3-6-pro">Universal-3.6 Pro Realtime</option>
      </select>
    </label>
    <label>Font
      <select id="font">
        <option value="sans">Sans</option>
        <option value="rounded">Rounded</option>
        <option value="serif">Serif</option>
        <option value="mono">Monospace</option>
        <option value="custom">A font on this computer…</option>
      </select>
    </label>
    <label id="fontbox" hidden>Font name <input id="fontname" type="text" placeholder="e.g. Inter" spellcheck="false"></label>
    <label>Size <input id="size" type="range" min="20" max="140" step="2"></label>
    <label>Position
      <select id="pos"><option value="bottom">Bottom</option><option value="middle">Middle</option><option value="top">Top</option></select>
    </label>
    <label>Lines
      <select id="lines"><option value="1">1</option><option value="2">2</option></select>
    </label>
    <label>Style
      <select id="style"><option value="box">Black box</option><option value="outline">Outlined text</option></select>
    </label>
    <label>Background
      <select id="bg"><option value="dark">Black</option><option value="transparent">Transparent</option><option value="green">Green (chroma key)</option></select>
    </label>
  </div>
  <div class="row">
    <button id="popout" type="button">Pop out, always on top</button>
    <button id="fullscreen" type="button">Full screen</button>
    <button id="copy" type="button">Copy overlay URL</button>
    <input id="overlayurl" type="text" readonly hidden style="flex: 1; min-width: 220px">
  </div>
</section>

<script>
"use strict";
// Live captions with AssemblyAI realtime Speech-to-Text. The mic is captured with Web Audio, turned into
// 16 kHz 16-bit PCM in an AudioWorklet and streamed over a WebSocket with a short-lived token from
// /api/token. Settings live in the URL, so an overlay URL carries them; nothing is saved.

const STREAMING_URL = "wss://streaming.assemblyai.com/v3/ws";
const ONLY_36 = ["af", "yue", "et", "gl", "ko", "mr", "nn", "fa", "ro", "ru", "ur", "xh", "zu"];
const FONTS = {
  sans: 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif',
  rounded: 'ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif',
  serif: 'Georgia, "Noto Serif", "Times New Roman", serif',
  mono: 'ui-monospace, Menlo, Consolas, "Noto Sans Mono", monospace',
};
const DEFAULTS = { lang: "", codes: "", model: "universal-3-5-pro", font: "sans", fontname: "", size: "44",
                   pos: "bottom", lines: "2", style: "box", bg: "dark" };
const ERRORS = { denied: "Sign-in was cancelled.", signin: "Sign-in didn't finish. Try again.",
                 unavailable: "AssemblyAI's sign-in couldn't be reached. Try again in a minute." };
const IDLE_CLEAR_MS = 8000;

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const overlay = params.get("overlay") === "1";
const settings = Object.fromEntries(Object.entries(DEFAULTS).map(([k, v]) => [k, params.get(k) ?? v]));
// Held, not looked up: "Pop out" moves the captions into another window's document.
const captionsEl = $("captions"), textEl = $("text"), noticeEl = $("notice"), noticeText = $("noticetext");

let config = { mode: "dev", signed_in: false };
let running = false, ws = null, stream = null, ctx = null, retries = 0, idleTimer = null;
let finals = "", current = [];

// ---------- settings ----------

function languageCodes() {
  const raw = settings.lang === "custom" ? settings.codes : settings.lang;
  return raw.split(/[\s,+]+/).map((c) => c.trim().toLowerCase()).filter((c) => /^[a-z]{2,3}$/.test(c));
}

function speechModel() {
  // Languages only Universal-3.6 Pro knows switch the model; the page says so.
  return languageCodes().some((c) => ONLY_36.includes(c)) ? "universal-3-6-pro" : settings.model;
}

function applySettings() {
  const cap = captionsEl;
  const name = settings.fontname.replace(/["\\;{}<>]/g, "").trim();
  cap.style.setProperty("--font", settings.font === "custom" && name ? `"${name}", ${FONTS.sans}` : FONTS[settings.font] || FONTS.sans);
  cap.style.setProperty("--size", `${Number(settings.size) || 44}px`);
  cap.style.setProperty("--lines", settings.lines === "1" ? "1" : "2");
  cap.className = `captions ${["top", "middle"].includes(settings.pos) ? settings.pos : "bottom"} style-${settings.style === "outline" ? "outline" : "box"}`;
  for (const bg of ["dark", "transparent", "green"]) document.body.classList.toggle(`bg-${bg}`, settings.bg === bg);
  $("codesbox").hidden = settings.lang !== "custom";
  $("fontbox").hidden = settings.font !== "custom";
  if (!overlay) {
    const q = new URLSearchParams(Object.entries(settings).filter(([k, v]) => v !== DEFAULTS[k]));
    history.replaceState(null, "", q.toString() ? `?${q}` : location.pathname);
  }
}

function bindSettings() {
  for (const key of Object.keys(DEFAULTS)) {
    const el = $(key);
    el.value = settings[key];
    el.addEventListener("input", () => {
      settings[key] = el.value;
      applySettings();
      if (running && ["lang", "codes", "model"].includes(key)) restartSoon();
    });
  }
}

let restartTimer = null;
function restartSoon() {
  // A language or model change needs a new session: the WebSocket is opened with them.
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => { if (ws) ws.close(4000, "settings changed"); }, 600);
}

function overlayUrl() {
  const q = new URLSearchParams(Object.entries(settings).filter(([k, v]) => v !== DEFAULTS[k]));
  q.set("overlay", "1");
  q.set("bg", settings.bg === "dark" ? "transparent" : settings.bg);
  return `${location.origin}${location.pathname}?${q}`;
}

// ---------- status and captions ----------

function setStatus(text, error = false) {
  $("status").textContent = text;
  $("status").classList.toggle("error", error);
  if (overlay && error) hint(text);
}

function hint(text, link) {
  const h = $("hint");
  h.replaceChildren(text);
  if (link) {
    const a = document.createElement("a");
    a.href = link.href;
    a.textContent = link.text;
    h.append(" ", a);
  }
  h.hidden = !text;
}

function setOn(on) {
  noticeEl.classList.toggle("on", on);
  noticeText.textContent = on ? "Live captions on" : "Live captions off";
  $("start").textContent = on ? "Stop captions" : "Start captions";
  $("start").classList.toggle("primary", !on);
}

function render() {
  const p = textEl;
  const nodes = [document.createTextNode(finals)];
  for (const w of current) {
    const span = document.createElement("span");
    span.textContent = w.text;
    if (!w.word_is_final) span.className = "partial";   // still changing: dim until it's final
    nodes.push(document.createTextNode(" "), span);
  }
  p.replaceChildren(...nodes);
  p.parentElement.parentElement.classList.toggle("empty", !finals && !current.length);
}

function onTurn(turn) {
  if (turn.end_of_turn) {
    // Keep a little history for the lines above; the box only shows the last one or two.
    finals = `${finals} ${turn.transcript}`.trim();
    if (finals.length > 500) finals = finals.slice(finals.indexOf(" ", finals.length - 400) + 1);
    current = [];
  } else {
    current = turn.words || [];
  }
  render();
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { finals = ""; current = []; render(); }, IDLE_CLEAR_MS);
}

// ---------- audio: mic -> 16 kHz PCM ----------

// Runs on the audio thread. Averages the device's samples down to 16 kHz (a light low-pass) and
// posts 50 ms chunks of 16-bit little-endian PCM, the size AssemblyAI recommends.
const WORKLET = `
class Pcm16 extends AudioWorkletProcessor {
  constructor() { super(); this.step = sampleRate / 16000; this.acc = 0; this.sum = 0; this.count = 0; this.reset(); }
  reset() { this.out = new Int16Array(800); this.n = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.sum += ch[i]; this.count++; this.acc++;
      if (this.acc >= this.step) {
        this.acc -= this.step;
        const s = Math.max(-1, Math.min(1, this.sum / this.count));
        this.out[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
        this.sum = 0; this.count = 0;
        if (this.n === this.out.length) { this.port.postMessage(this.out.buffer, [this.out.buffer]); this.reset(); }
      }
    }
    return true;
  }
}
registerProcessor("pcm16", Pcm16);`;

async function startAudio() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  ctx = new AudioContext();
  const url = URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" }));
  await ctx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  const node = new AudioWorkletNode(ctx, "pcm16");
  node.port.onmessage = (e) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data); };
  const silent = ctx.createGain();   // keeps the graph pulling audio without playing the mic back
  silent.gain.value = 0;
  ctx.createMediaStreamSource(stream).connect(node).connect(silent).connect(ctx.destination);
  if (ctx.state === "suspended") {
    hint("Click anywhere to start captions");
    document.addEventListener("pointerdown", () => { ctx.resume(); hint(""); }, { once: true });
  }
}

function stopAudio() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (ctx) ctx.close();
  stream = ctx = null;
}

// ---------- the WebSocket ----------

async function connect() {
  const r = await fetch("/api/token", { method: "POST" });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401) {
    config.signed_in = false;
    showAccount();
    throw new Error("Sign in with AssemblyAI to start captions.");
  }
  if (!r.ok) throw new Error(body.detail || `Couldn't get a streaming token (HTTP ${r.status}).`);

  const q = new URLSearchParams({ sample_rate: "16000", encoding: "pcm_s16le", speech_model: speechModel(), token: body.token });
  const codes = languageCodes();
  if (codes.length) q.set("language_codes", JSON.stringify(codes));
  const socket = new WebSocket(`${STREAMING_URL}?${q}`);
  ws = socket;
  socket.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "Begin") {
      retries = 0;
      const model = msg.configuration && msg.configuration.model;
      setStatus(`Listening · ${model || speechModel()}${speechModel() !== settings.model ? " (needed for this language)" : ""}`);
      hint("");
    } else if (msg.type === "Turn") {
      onTurn(msg);
    } else if (msg.type === "Error") {
      setStatus(`AssemblyAI: ${msg.error} (${msg.error_code})`, true);
    }
  };
  socket.onclose = (e) => {
    if (ws === socket) ws = null;
    if (!running) return;
    if (e.code === 4000) { reconnect(0); return; }   // our own restart after a settings change
    if (e.code === 1008 || e.code === 3005 || ++retries > 5) {
      stop(`Captions stopped: ${e.reason || `connection closed (${e.code})`}`);
      return;
    }
    setStatus(`Reconnecting… (${e.reason || e.code})`);
    reconnect(1000 * retries);
  };
}

function reconnect(delay) {
  setTimeout(() => {
    if (running && !ws) connect().catch((err) => stop(err.message));
  }, delay);
}

async function start() {
  running = true;
  setOn(true);
  setStatus("Starting…");
  try {
    await startAudio();
    await connect();
  } catch (err) {
    stop(err.name === "NotAllowedError" ? "Microphone access was blocked. Allow it in the address bar and try again." : err.message);
  }
}

function stop(error) {
  running = false;
  setOn(false);
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "Terminate" }));   // the server flushes the last turn, then closes
  ws = null;
  stopAudio();
  setStatus(error || "Stopped.", Boolean(error));
}

// ---------- account and mode ----------

function showAccount() {
  const oauth = config.mode === "oauth";
  $("mode").textContent = oauth ? (config.signed_in ? "Signed in with AssemblyAI" : "Sign in with your AssemblyAI account")
                                : "Dev mode · this server's API key";
  $("signin").hidden = !oauth || config.signed_in;
  $("signout").hidden = !oauth || !config.signed_in;
  if (overlay && oauth && !config.signed_in) hint("Not signed in.", { href: "/login", text: "Sign in with AssemblyAI" });
}

// ---------- window modes ----------

async function popOut() {
  if (!("documentPictureInPicture" in window)) {
    setStatus("This browser can't keep a window on top. Use Chrome or Edge, or open the overlay URL in its own window.", true);
    return;
  }
  const pip = await documentPictureInPicture.requestWindow({ width: 760, height: 220 });
  for (const style of document.querySelectorAll("style")) pip.document.head.append(style.cloneNode(true));
  pip.document.body.className = `${document.body.className} pip overlay`;
  const stage = pip.document.createElement("main");
  stage.id = "stage";
  stage.append(captionsEl);
  pip.document.body.append(stage);
  pip.addEventListener("pagehide", () => $("stage").prepend(captionsEl));
}

async function copyOverlayUrl() {
  const url = overlayUrl();
  $("overlayurl").value = url;
  $("overlayurl").hidden = false;
  try {
    await navigator.clipboard.writeText(url);
    setStatus("Overlay URL copied. Add it as a Browser Source in OBS, or open it in its own window.");
  } catch {
    $("overlayurl").select();
  }
}

// ---------- start up ----------

async function main() {
  document.body.classList.toggle("overlay", overlay);
  bindSettings();
  applySettings();
  setOn(false);
  if (ERRORS[params.get("error")]) setStatus(ERRORS[params.get("error")], true);
  $("start").addEventListener("click", () => (running ? stop() : start()));
  $("popout").addEventListener("click", () => popOut().catch((e) => setStatus(e.message, true)));
  $("fullscreen").addEventListener("click", () => $("stage").requestFullscreen().catch((e) => setStatus(e.message, true)));
  $("copy").addEventListener("click", copyOverlayUrl);
  try {
    config = await (await fetch("/api/config")).json();
  } catch {
    setStatus("The captions server isn't answering. Is python3 live/server.py running?", true);
    return;
  }
  showAccount();
  if (overlay && config.signed_in) start();
}

main();
</script>
</body>
</html>
