<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caption Player</title>
<style>
  :root {
    --bg: #f4f4f2; --fg: #1a1a1a; --muted: #666; --line: #d8d8d4; --stage: #111;
    --chip: #fff; --chip-on: #1a1a1a; --chip-on-fg: #fff;
    --cap-box: rgba(0, 0, 0, .72); --cap-final: #fff; --cap-dim: #8a8a8a; --cap-sub: #ddd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141414; --fg: #eee; --muted: #999; --line: #2c2c2c; --chip: #1e1e1e; --chip-on: #eee; --chip-on-fg: #111; }
  }
  :root[data-theme="dark"] { --bg: #141414; --fg: #eee; --muted: #999; --line: #2c2c2c; --chip: #1e1e1e; --chip-on: #eee; --chip-on-fg: #111; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .lede { color: var(--muted); margin: 0 0 20px; }
  .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .modes button { border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 999px;
    padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
  .stage { position: relative; aspect-ratio: 16 / 9; background: var(--stage); border-radius: 10px; overflow: hidden;
    container-type: inline-size; }
  .stage video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .stage .empty { position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, #3a3a3a, #111 70%); }
  .cap { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); width: max-content; max-width: 90%;
    text-align: center; pointer-events: none; }
  .cap .main, .cap .sub { display: inline-block; background: var(--cap-box); border-radius: 4px; padding: .12em .45em; }
  .cap .main { font-size: max(16px, 4.2cqw); line-height: 1.35; color: var(--cap-final); }
  .cap .sub { font-size: max(13px, 3cqw); line-height: 1.35; color: var(--cap-sub); margin-top: .3em; }
  .cap .w { transition: none; }
  .cap .w.dim { color: var(--cap-dim); }
  .cap .w.hidden { visibility: hidden; }
  .bar { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .bar button { border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 6px;
    padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; min-width: 72px; }
  .bar input[type=range] { flex: 1; }
  .bar .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  .opts { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; color: var(--muted); font-size: 14px; }
  .lines { margin-top: 24px; border-top: 1px solid var(--line); }
  .lines div { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line);
    cursor: pointer; font-size: 15px; }
  .lines div.on { font-weight: 600; }
  .lines .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .lines .tr { display: block; color: var(--muted); font-weight: 400; }
  @media (max-width: 520px) { .lines div { grid-template-columns: 48px 1fr; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Caption player</h1>
  <p class="lede" id="lede">Pick a caption mode and press play. Words turn from grey to white as they're spoken.</p>
  <div class="modes" id="modes"></div>
  <div class="stage" id="stage"><div class="cap" id="cap"></div></div>
  <div class="bar">
    <button id="play">Play</button>
    <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Seek">
    <span class="time" id="time">0:00</span>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="karaoke" checked> Word-by-word</label>
    <label><input type="checkbox" id="dual" checked> Second line</label>
  </div>
  <div class="lines" id="lines"></div>
</main>
<script>
// Filled in by `python -m captions`: {title, video, tracks: [{mode, label, cues: [{start, end, text, words, translation?}]}]}
const DATA = {"title": "Multilingual captions", "video": null, "tracks": [{"mode": "english", "label": "English", "cues": [{"start": 0.35, "end": 1.97, "text": "Captions don't have", "words": [{"text": "Captions", "start": 0.4, "end": 1.0, "speaker": "A"}, {"text": "don't", "start": 1.08, "end": 1.5, "speaker": "A"}, {"text": "have", "start": 1.58, "end": 1.94, "speaker": "A"}]}, {"start": 1.97, "end": 4.25, "text": "to stop at English.", "words": [{"text": "to", "start": 2.02, "end": 2.26, "speaker": "A"}, {"text": "stop", "start": 2.34, "end": 2.7, "speaker": "A"}, {"text": "at", "start": 2.78, "end": 3.02, "speaker": "A"}, {"text": "English.", "start": 3.1, "end": 3.7, "speaker": "A"}]}, {"start": 4.25, "end": 7.03, "text": "Pick a mode, drop in a video,", "words": [{"text": "Pick", "start": 4.3, "end": 4.66, "speaker": "A"}, {"text": "a", "start": 4.74, "end": 4.92, "speaker": "A"}, {"text": "mode,", "start": 5.0, "end": 5.42, "speaker": "A"}, {"text": "drop", "start": 5.5, "end": 5.86, "speaker": "A"}, {"text": "in", "start": 5.94, "end": 6.18, "speaker": "A"}, {"text": "a", "start": 6.26, "end": 6.44, "speaker": "A"}, {"text": "video,", "start": 6.52, "end": 7.0, "speaker": "A"}]}, {"start": 7.03, "end": 9.17, "text": "and every word shows up", "words": [{"text": "and", "start": 7.08, "end": 7.38, "speaker": "A"}, {"text": "every", "start": 7.46, "end": 7.88, "speaker": "A"}, {"text": "word", "start": 7.96, "end": 8.32, "speaker": "A"}, {"text": "shows", "start": 8.4, "end": 8.82, "speaker": "A"}, {"text": "up", "start": 8.9, "end": 9.14, "speaker": "A"}]}, {"start": 9.17, "end": 11.74, "text": "right when it's spoken.", "words": [{"text": "right", "start": 9.22, "end": 9.64, "speaker": "A"}, {"text": "when", "start": 9.72, "end": 10.08, "speaker": "A"}, {"text": "it's", "start": 10.16, "end": 10.52, "speaker": "A"}, {"text": "spoken.", "start": 10.6, "end": 11.14, "speaker": "A"}]}]}, {"mode": "hindi", "label": "Hindi", "cues": [{"start": 0.35, "end": 2.23, "text": "नमस्ते, आज हम देखेंगे", "words": [{"text": "नमस्ते,", "start": 0.4, "end": 0.94, "speaker": "A"}, {"text": "आज", "start": 1.02, "end": 1.26, "speaker": "A"}, {"text": "हम", "start": 1.34, "end": 1.58, "speaker": "A"}, {"text": "देखेंगे", "start": 1.66, "end": 2.2, "speaker": "A"}]}, {"start": 2.23, "end": 4.95, "text": "कि कैप्शन कैसे बनते हैं।", "words": [{"text": "कि", "start": 2.28, "end": 2.52, "speaker": "A"}, {"text": "कैप्शन", "start": 2.6, "end": 3.08, "speaker": "A"}, {"text": "कैसे", "start": 3.16, "end": 3.52, "speaker": "A"}, {"text": "बनते", "start": 3.6, "end": 3.96, "speaker": "A"}, {"text": "हैं।", "start": 4.04, "end": 4.4, "speaker": "A"}]}, {"start": 4.95, "end": 7.47, "text": "हर शब्द ठीक उसी समय स्क्रीन", "words": [{"text": "हर", "start": 5.0, "end": 5.24, "speaker": "A"}, {"text": "शब्द", "start": 5.32, "end": 5.68, "speaker": "A"}, {"text": "ठीक", "start": 5.76, "end": 6.06, "speaker": "A"}, {"text": "उसी", "start": 6.14, "end": 6.44, "speaker": "A"}, {"text": "समय", "start": 6.52, "end": 6.82, "speaker": "A"}, {"text": "स्क्रीन", "start": 6.9, "end": 7.44, "speaker": "A"}]}, {"start": 7.47, "end": 10.96, "text": "पर आता है जब वह बोला जाता है।", "words": [{"text": "पर", "start": 7.52, "end": 7.76, "speaker": "A"}, {"text": "आता", "start": 7.84, "end": 8.14, "speaker": "A"}, {"text": "है", "start": 8.22, "end": 8.46, "speaker": "A"}, {"text": "जब", "start": 8.54, "end": 8.78, "speaker": "A"}, {"text": "वह", "start": 8.86, "end": 9.1, "speaker": "A"}, {"text": "बोला", "start": 9.18, "end": 9.54, "speaker": "A"}, {"text": "जाता", "start": 9.62, "end": 9.98, "speaker": "A"}, {"text": "है।", "start": 10.06, "end": 10.36, "speaker": "A"}]}]}, {"mode": "hinglish", "label": "Hinglish", "cues": [{"start": 0.35, "end": 3.45, "text": "आज की meeting बहुत अच्छी थी।", "words": [{"text": "आज", "start": 0.4, "end": 0.64, "speaker": "A"}, {"text": "की", "start": 0.72, "end": 0.96, "speaker": "A"}, {"text": "meeting", "start": 1.04, "end": 1.58, "speaker": "A"}, {"text": "बहुत", "start": 1.66, "end": 2.02, "speaker": "A"}, {"text": "अच्छी", "start": 2.1, "end": 2.52, "speaker": "A"}, {"text": "थी।", "start": 2.6, "end": 2.9, "speaker": "A"}]}, {"start": 3.45, "end": 5.77, "text": "सबने अपने ideas share किए,", "words": [{"text": "सबने", "start": 3.5, "end": 3.86, "speaker": "A"}, {"text": "अपने", "start": 3.94, "end": 4.3, "speaker": "A"}, {"text": "ideas", "start": 4.38, "end": 4.8, "speaker": "A"}, {"text": "share", "start": 4.88, "end": 5.3, "speaker": "A"}, {"text": "किए,", "start": 5.38, "end": 5.74, "speaker": "A"}]}, {"start": 5.77, "end": 9.04, "text": "और next week हम demo दिखाएंगे।", "words": [{"text": "और", "start": 5.82, "end": 6.06, "speaker": "A"}, {"text": "next", "start": 6.14, "end": 6.5, "speaker": "A"}, {"text": "week", "start": 6.58, "end": 6.94, "speaker": "A"}, {"text": "हम", "start": 7.02, "end": 7.26, "speaker": "A"}, {"text": "demo", "start": 7.34, "end": 7.7, "speaker": "A"}, {"text": "दिखाएंगे।", "start": 7.78, "end": 8.44, "speaker": "A"}]}]}, {"mode": "hinglish-roman", "label": "Hinglish (Roman)", "cues": [{"start": 0.35, "end": 3.45, "text": "aaj ki meeting bahut acchi thi.", "words": [{"text": "aaj", "start": 0.4, "end": 0.64, "speaker": "A"}, {"text": "ki", "start": 0.72, "end": 0.96, "speaker": "A"}, {"text": "meeting", "start": 1.04, "end": 1.58, "speaker": "A"}, {"text": "bahut", "start": 1.66, "end": 2.02, "speaker": "A"}, {"text": "acchi", "start": 2.1, "end": 2.52, "speaker": "A"}, {"text": "thi.", "start": 2.6, "end": 2.9, "speaker": "A"}]}, {"start": 3.45, "end": 5.77, "text": "sabne apne ideas share kiye,", "words": [{"text": "sabne", "start": 3.5, "end": 3.86, "speaker": "A"}, {"text": "apne", "start": 3.94, "end": 4.3, "speaker": "A"}, {"text": "ideas", "start": 4.38, "end": 4.8, "speaker": "A"}, {"text": "share", "start": 4.88, "end": 5.3, "speaker": "A"}, {"text": "kiye,", "start": 5.38, "end": 5.74, "speaker": "A"}]}, {"start": 5.77, "end": 9.04, "text": "aur next week hum demo dikhayenge.", "words": [{"text": "aur", "start": 5.82, "end": 6.06, "speaker": "A"}, {"text": "next", "start": 6.14, "end": 6.5, "speaker": "A"}, {"text": "week", "start": 6.58, "end": 6.94, "speaker": "A"}, {"text": "hum", "start": 7.02, "end": 7.26, "speaker": "A"}, {"text": "demo", "start": 7.34, "end": 7.7, "speaker": "A"}, {"text": "dikhayenge.", "start": 7.78, "end": 8.44, "speaker": "A"}]}]}, {"mode": "mandarin+english", "label": "Mandarin + English", "cues": [{"start": 0.35, "end": 4.39, "text": "大家好，今天我们来看看双语字幕。", "words": [{"text": "大家", "start": 0.4, "end": 0.76, "speaker": "A"}, {"text": "好，", "start": 0.84, "end": 1.2, "speaker": "A"}, {"text": "今天", "start": 1.28, "end": 1.64, "speaker": "A"}, {"text": "我们", "start": 1.72, "end": 2.08, "speaker": "A"}, {"text": "来", "start": 2.16, "end": 2.4, "speaker": "A"}, {"text": "看看", "start": 2.48, "end": 2.84, "speaker": "A"}, {"text": "双语", "start": 2.92, "end": 3.28, "speaker": "A"}, {"text": "字幕。", "start": 3.36, "end": 3.84, "speaker": "A"}], "translation": "Hi everyone, today let's look at dual captions."}, {"start": 4.39, "end": 7.99, "text": "中文在上面，英文翻译在下面。", "words": [{"text": "中文", "start": 4.44, "end": 4.8, "speaker": "A"}, {"text": "在", "start": 4.88, "end": 5.12, "speaker": "A"}, {"text": "上面，", "start": 5.2, "end": 5.68, "speaker": "A"}, {"text": "英文", "start": 5.76, "end": 6.12, "speaker": "A"}, {"text": "翻译", "start": 6.2, "end": 6.56, "speaker": "A"}, {"text": "在", "start": 6.64, "end": 6.88, "speaker": "A"}, {"text": "下面。", "start": 6.96, "end": 7.44, "speaker": "A"}], "translation": "Chinese on top, the English translation below."}, {"start": 7.99, "end": 10.32, "text": "这个 demo 很简单。", "words": [{"text": "这个", "start": 8.04, "end": 8.4, "speaker": "A"}, {"text": "demo", "start": 8.48, "end": 8.84, "speaker": "A"}, {"text": "很", "start": 8.92, "end": 9.16, "speaker": "A"}, {"text": "简单。", "start": 9.24, "end": 9.72, "speaker": "A"}], "translation": "This demo is simple."}]}], "fonts": []};

const $ = (id) => document.getElementById(id);
const stage = $("stage"), cap = $("cap");
let track = DATA.tracks[0], video = null, clock = 0, playing = false, last = null;
const duration = () => video ? (video.duration || 0) : Math.max(0, ...DATA.tracks.flatMap(t => t.cues.map(c => c.end))) + 0.5;
const now = () => video ? video.currentTime : clock;
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const cjk = (ch) => /[⺀-鿿豈-﫿＀-￯　-〿]/.test(ch || "");

// fonts from the fonts/ folder, by the family name the CLI read from each file
for (const f of DATA.fonts || []) {
  const s = document.createElement("style");
  const fam = String(f.family).replace(/["\\<>;{}]/g, "");          // names come from font files: keep them inert
  s.textContent = `@font-face { font-family: "${fam}"; src: url("${encodeURI(f.url).replace(/"/g, "%22")}"); }`;
  document.head.append(s);
}
$("title").textContent = DATA.title;
document.title = DATA.title;
if (DATA.video) {
  video = document.createElement("video");
  video.src = DATA.video; video.playsInline = true; video.preload = "metadata";
  video.addEventListener("loadedmetadata", () => { $("seek").max = duration(); });
  video.addEventListener("ended", () => setPlaying(false));
  stage.prepend(video);
} else {
  stage.insertAdjacentHTML("afterbegin", '<div class="empty"></div>');
}

function setTrack(t) {
  track = t;
  for (const b of $("modes").children) b.setAttribute("aria-pressed", b.dataset.mode === t.mode);
  $("lines").innerHTML = "";
  t.cues.forEach((c, i) => {
    const row = document.createElement("div");
    row.innerHTML = `<span class="t">${fmt(c.start)}</span><span></span>`;
    row.lastChild.textContent = c.text;
    if (c.translation) { const tr = document.createElement("span"); tr.className = "tr"; tr.textContent = c.translation; row.lastChild.append(tr); }
    row.onclick = () => seek(c.start + 0.01);
    $("lines").append(row);
  });
  last = null; render();
}

DATA.tracks.forEach((t) => {
  const b = document.createElement("button");
  b.textContent = t.label; b.dataset.mode = t.mode; b.onclick = () => setTrack(t);
  $("modes").append(b);
});
if (DATA.tracks.length < 2) $("modes").hidden = true;

function render() {
  const t = now();
  const i = track ? track.cues.findIndex(c => c.start <= t && t < c.end) : -1;
  const key = `${track && track.mode}|${i}|${$("karaoke").checked}|${$("dual").checked}`;
  if (key !== last) {
    last = key; cap.innerHTML = "";
    [...$("lines").children].forEach((r, n) => r.classList.toggle("on", n === i));
    if (i >= 0) {
      const c = track.cues[i], main = document.createElement("div");
      main.className = "main";
      if (track.font) main.style.fontFamily = track.font;
      main.dir = track.rtl ? "rtl" : "auto";
      c.words.forEach((w, n) => {
        const prev = n ? c.words[n - 1].text : "";
        if (n && !(cjk(prev.slice(-1)) && cjk(w.text[0]))) main.append(" ");
        const s = document.createElement("span"); s.className = "w"; s.textContent = w.text; s.dataset.start = w.start; s.dataset.end = w.end;
        main.append(s);
      });
      cap.append(main);
      if (c.translation && $("dual").checked) {
        const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = c.translation; sub.dir = "auto";
        if (track.font2) sub.style.fontFamily = track.font2;
        cap.append(document.createElement("br"), sub);
      }
    }
  }
  // Each word appears grey when it starts and turns white when it ends, like live captions.
  for (const s of cap.querySelectorAll(".w")) {
    const on = $("karaoke").checked;
    s.classList.toggle("hidden", on && t < +s.dataset.start - 0.02);
    s.classList.toggle("dim", on && t < +s.dataset.end);
  }
  $("seek").value = t; $("time").textContent = `${fmt(t)} / ${fmt(duration())}`;
}

let prevFrame = null;
function tick(ts) {
  if (playing && !video) {
    clock += prevFrame == null ? 0 : (ts - prevFrame) / 1000;
    if (clock >= duration()) clock = 0;              // the demo loops
  }
  prevFrame = ts; render(); requestAnimationFrame(tick);
}
function setPlaying(p) {
  playing = p; $("play").textContent = p ? "Pause" : "Play";
  if (video) p ? video.play() : video.pause();
}
function seek(t) { if (video) video.currentTime = t; else clock = t; render(); }

$("play").onclick = () => setPlaying(!playing);
$("seek").max = duration();
$("seek").oninput = (e) => seek(+e.target.value);
$("karaoke").onchange = $("dual").onchange = () => { last = null; render(); };
$("dual").parentElement.hidden = !DATA.tracks.some(t => t.cues.some(c => c.translation));
if (track) setTrack(track);
requestAnimationFrame(tick);
</script>
</body>
</html>
